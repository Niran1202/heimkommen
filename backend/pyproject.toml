[project]
name = "heimkommen-backend"
version = "1.0.0"
description = "Heimkommen backend: regional journey planning with delay risk"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.7.1",
  "email-validator>=2.2.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "bcrypt>=4.1.2",
  "python-jose[cryptography]>=3.3.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "lightgbm>=4.5",
  "celery>=5.4",
  "prometheus-client>=0.20",
  "tzdata>=2024.1",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers[postgres,redis]>=4.8",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E731"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/"]
