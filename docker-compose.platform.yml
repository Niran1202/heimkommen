# Delay data platform (SQL layer): a separate Postgres on port 5433 so it never clashes with the app's database.
#   docker compose -f docker-compose.platform.yml up -d
#   python scripts/rail_db.py init
#   python scripts/rail_db.py load --months 2026-05 2026-06 ...
# Memory settings are modest on purpose (laptop with 8 GB RAM).
services:
  rail-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rail
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail   # local only, never exposed beyond localhost
    ports: ["127.0.0.1:5433:5432"]
    volumes: [rail_pgdata:/var/lib/postgresql/data]
    command: >
      postgres -c shared_buffers=256MB -c work_mem=32MB -c maintenance_work_mem=256MB
      -c max_wal_size=2GB -c checkpoint_timeout=15min
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail -d rail"]
      interval: 5s
      retries: 10
volumes:
  rail_pgdata:
