# Local development: api, worker, beat, postgres, redis, frontend
#   docker compose up --build
# The timetable/model data live on your laptop (./data, ./ml/artifacts) and are mounted in.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heimkommen}
      POSTGRES_USER: ${POSTGRES_USER:-heimkommen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heimkommen}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heimkommen} -d ${POSTGRES_DB:-heimkommen}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api: &backend
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-heimkommen}:${POSTGRES_PASSWORD:-heimkommen}@postgres:5432/${POSTGRES_DB:-heimkommen}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    volumes:
      - ./data:/data
      - ./ml/artifacts:/artifacts
      - ./backend/app:/app/app
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Worker and beat reuse the api service definition (same image and settings).
  worker:
    <<: *backend
    ports: []
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1

  beat:
    <<: *backend
    ports: []
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build: {context: ./frontend, target: dev}
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend/src:/app/src
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  postgres_data:
