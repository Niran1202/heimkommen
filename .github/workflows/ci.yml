name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests ../scripts ../ml/pipelines ../desktop
      - name: Type check
        run: mypy app
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests (Postgres + Redis via testcontainers)
        run: pytest tests/integration
      - name: Migrations apply to an empty database
        run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    # Builds every image and runs the local stack end to end with a small test timetable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p data ml/artifacts && chmod 777 data ml/artifacts
      - name: Build and start postgres, redis, api, worker, frontend
        run: docker compose up -d --build postgres redis api worker frontend
      - name: Import the test timetable inside the api container
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8000/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS localhost:8000/health
          docker compose run --rm \
            -v "$PWD/backend/tests/fixtures:/fixtures:ro" -v "$PWD/scripts:/scripts:ro" \
            api python /scripts/ingest_gtfs.py --path /fixtures/mini_gtfs
      - name: Smoke test the API and the frontend proxy
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS "localhost:8000/api/v1/stations?search=Villingen" | grep -q "Villingen Bahnhof"
          curl -fsS "localhost:8000/api/v1/journeys/home-check?from=Villingen&to=Stuttgart%20Hbf&after=19:00&date=2026-09-25" \
            | tee home-check.json | grep -q '"departure":"19:40"'
          curl -fsS localhost:8000/health | grep -q '"timetable_loaded":true'
          for i in $(seq 1 30); do curl -fsS localhost:5173/ >/dev/null && break; sleep 2; done
          curl -fsS "localhost:5173/api/v1/stations?search=Rottweil" | grep -q "Rottweil Bahnhof"
      - name: Build the production images
        run: |
          DOMAIN=example.org POSTGRES_PASSWORD=x GRAFANA_ADMIN_PASSWORD=x docker compose -f docker-compose.prod.yml config -q
          docker build --target web -t heimkommen-web frontend
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
